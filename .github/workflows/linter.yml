name: Linter
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  Ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: pip install ruff==0.15.16

      - name: Run Ruff linter
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .
